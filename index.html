<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トキタビ — 通しデモ</title>
<style>
  :root{ --coral:#D85A30; --coral-deep:#712B13; --coral-mid:#993C1D; --coral-bg:#FAECE7; --coral-100:#F5C4B3; --coral-200:#F0997B; --ink:#4A1B0C; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg, rgba(74,27,12,.2) 0%, rgba(113,43,19,.5) 55%, rgba(113,43,19,.78) 100%), url('https://images.unsplash.com/photo-1595867818082-083862f3d630?w=1200&q=80&auto=format&fit=crop');
    background-size:cover; background-position:center; background-attachment:fixed; min-height:100vh; }
  .app{ max-width:420px; margin:0 auto; min-height:100vh; }
  .hero{ position:relative; height:150px; }
  .hero .top{ position:absolute; top:14px; left:16px; right:16px; display:flex; align-items:center; gap:8px; color:#fff; }
  .hero .dot{ width:10px; height:10px; border-radius:50%; background:#fff; }
  .hero b{ font-size:15px; letter-spacing:0.1em; font-weight:600; }
  .hero .back{ display:none; align-items:center; gap:4px; font-size:14px; font-weight:600; color:#fff; background:rgba(74,27,12,.42); border:none; border-radius:999px; padding:8px 15px 8px 12px; cursor:pointer; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); margin-right:4px; }
  .hero h1{ position:absolute; left:20px; right:20px; bottom:18px; margin:0; font-size:23px; color:#fff; font-weight:600; text-shadow:0 1px 12px rgba(74,27,12,.5); line-height:1.25; }
  .sheet{ background:rgba(250,246,242,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:26px 26px 0 0; box-shadow:0 -8px 30px rgba(74,27,12,.18); padding:22px 16px 60px; }
  .label{ font-size:13px; font-weight:600; color:var(--coral-deep); margin:18px 0 8px; display:flex; align-items:center; gap:6px; }
  .label:first-child{ margin-top:0; }
  .req{ font-size:11px; color:#fff; background:var(--coral); border-radius:999px; padding:1px 8px; }
  input[type=text]{ flex:1; height:44px; border:1.5px solid var(--coral-100); border-radius:12px; padding:0 14px; font-size:15px; background:#FFFDFB; color:var(--ink); outline:none; }
  input[type=text]:focus{ border-color:var(--coral); }
  .add{ height:44px; padding:0 16px; border:none; border-radius:12px; background:var(--coral); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--coral-100); color:var(--ink); border-radius:999px; padding:7px 12px 7px 14px; font-size:14px; }
  .chip button{ border:none; background:none; color:var(--coral-mid); cursor:pointer; font-size:16px; padding:0; }
  .hint{ font-size:12px; color:#8a6f63; margin-top:8px; }
  .stepper{ display:inline-flex; align-items:center; border:1.5px solid var(--coral-100); border-radius:12px; overflow:hidden; background:#FFFDFB; }
  .stepper button{ width:44px; height:44px; border:none; background:transparent; color:var(--coral); font-size:20px; cursor:pointer; }
  .stepper span{ width:60px; text-align:center; font-size:15px; font-weight:600; }
  .seg{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg button{ flex:1; min-width:88px; height:44px; border:1.5px solid var(--coral-100); border-radius:12px; background:#FFFDFB; color:var(--coral-mid); font-size:14px; cursor:pointer; }
  .seg button.on{ background:var(--coral); border-color:var(--coral); color:#fff; font-weight:600; }
  .traveler{ display:flex; align-items:center; gap:8px; background:var(--coral-bg); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--coral-deep); }
  .cta{ width:100%; height:52px; border:none; border-radius:14px; background:var(--coral); color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:24px; box-shadow:0 4px 12px rgba(216,90,48,.3); }
  .cta:disabled{ opacity:.45; box-shadow:none; cursor:not-allowed; }
  /* shiori */
  .card{ background:var(--coral-bg); border-radius:22px; padding:24px; margin-bottom:14px; }
  .card .hd{ display:flex; justify-content:space-between; align-items:center; }
  .card .bd{ display:flex; align-items:center; gap:7px; }
  .card .cdot{ width:9px; height:9px; border-radius:50%; background:var(--coral); }
  .card .bn{ font-size:13px; letter-spacing:0.1em; color:var(--coral-mid); font-weight:600; }
  .card .country{ font-size:13px; color:var(--coral-mid); margin-top:20px; }
  .card .city{ font-size:34px; font-weight:600; color:var(--ink); line-height:1.05; }
  .card .en{ font-size:13px; color:var(--coral-deep); margin-top:3px; }
  .badge{ display:inline-flex; align-items:center; gap:6px; background:var(--coral); color:#fff; font-size:14px; font-weight:600; padding:8px 16px; border-radius:999px; margin-top:14px; }
  .strip{ display:flex; gap:3px; margin-top:16px; }
  .strip i{ height:8px; border-radius:3px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; }
  .cell{ background:#fff; border-radius:13px; padding:11px 13px; }
  .cell .k{ font-size:11px; color:var(--coral-mid); }
  .cell .v{ font-size:14px; color:var(--ink); font-weight:600; margin-top:2px; }
  .safe{ grid-column:1 / -1; background:var(--coral-deep); border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
  .safe .k{ font-size:11px; color:var(--coral-100); }
  .safe .v{ font-size:14px; color:#fff; font-weight:600; }
  .foot{ border-top:1px solid var(--coral-200); margin-top:16px; padding-top:14px; display:flex; justify-content:space-between; font-size:12px; color:var(--coral-deep); }
  .cardbtn{ width:100%; height:46px; border:1.5px solid var(--coral); border-radius:12px; background:#fff; color:var(--coral-deep); font-size:14px; font-weight:600; cursor:pointer; margin-top:2px; }
  /* checklist */
  .ctx{ display:flex; flex-wrap:wrap; gap:6px; }
  .ctx span{ font-size:12px; background:#fff; border:1px solid var(--coral-100); color:var(--coral-deep); padding:5px 11px; border-radius:999px; }
  .bar{ height:10px; background:#fff; border:1px solid var(--coral-100); border-radius:999px; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; width:0; background:var(--coral); transition:width .25s; }
  .grp{ margin-top:20px; }
  .grp h2{ font-size:14px; color:var(--coral-deep); font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:7px; }
  .grp .ic{ width:26px; height:26px; border-radius:8px; background:var(--coral-bg); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .ci{ background:#fff; border:1px solid #F2E7E0; border-radius:13px; margin-bottom:8px; overflow:hidden; }
  .ci.done{ background:#FBF3EE; border-color:var(--coral-100); }
  .irow{ display:flex; align-items:flex-start; gap:11px; padding:12px 13px; }
  .box{ flex:none; width:22px; height:22px; border:2px solid var(--coral-200); border-radius:7px; display:flex; align-items:center; justify-content:center; margin-top:1px; cursor:pointer; }
  .ci.done .box{ background:var(--coral); border-color:var(--coral); }
  .box span{ opacity:0; }
  .ci.done .box span{ opacity:1; }
  .t{ font-size:14px; color:var(--ink); line-height:1.45; cursor:pointer; }
  .ci.done .t{ color:#9a8478; text-decoration:line-through; }
  .cwhy{ margin-top:7px; border:none; background:none; padding:0; color:var(--coral-mid); font-size:12px; font-weight:600; cursor:pointer; }
  .cwhybox{ display:none; padding:0 14px 14px 46px; }
  .cwhybox.open{ display:block; }
  .cwhyin{ border-left:2px solid var(--coral-200); padding-left:12px; }
  .cwhytxt{ font-size:13px; color:#6b5147; line-height:1.6; }
  .cwhysrc{ margin-top:4px; }
  /* share */
  .sgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .sbtn{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--coral-100); border-radius:13px; padding:13px 14px; font-size:14px; color:var(--ink); cursor:pointer; }
  .sbtn .sic{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; }
  .tags{ background:#fff; border:1px dashed var(--coral-100); border-radius:12px; padding:12px 14px; margin-top:16px; font-size:13px; color:var(--coral-mid); line-height:1.7; }
  .demo{ font-size:11px; color:#9b8a82; text-align:center; margin-top:12px; }
  .dots{ display:flex; justify-content:center; gap:7px; padding:14px 0 4px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.5); }
  .dots i.on{ background:#fff; width:20px; border-radius:4px; }
  .hidden{ display:none; }
</style>
</head>
